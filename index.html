<!doctype html>
<html lang="fr">
	<head>
		<meta charset="UTF-8" />
		<title>Ticket de Caisse</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<form id="form">
			<div class="field">
				<label>Article</label>
				<input type="text" id="article" placeholder="Nom de l'article" />
			</div>
			<div class="field">
				<label>Quantité</label>
				<input type="number" id="qty" placeholder="1" min="1" />
			</div>
			<div class="field">
				<label>Prix unitaire</label>
				<input
					type="number"
					id="price"
					placeholder="0.00"
					min="0"
					step="0.01"
				/>
			</div>
			<input type="submit" value="Ajouter" />
		</form>

		<div class="ticket">
			<h2 class="ticket-title">Ticket de Caisse</h2>

			<table>
				<thead>
					<tr>
						<th>Article</th>
						<th>Qté</th>
						<th>P.U.</th>
						<th>Total</th>
					</tr>
				</thead>
				<tbody id="tbody"></tbody>
			</table>
		</div>

		<ul id="liste"></ul>
	</body>
	<script type="module" src="/main.js"></script>
</html>
